name = "nvim"

bashrc = [
    "alias vi='nvim .'",
    "export PATH=\"$HOME/.ghcup/bin:$PATH\"",
    "alias so='source .venv/bin/activate'",
]

[packages]
pacman = [
    "neovim",
    "tree-sitter-cli",
    "rustup",
    "jdk-openjdk",
    "wl-clipboard",
    "ripgrep",
    "fd",
    "webkit2gtk-4.1",
    "base-devel",
    "curl",
    "wget",
    "file",
    "openssl",
    "appmenu-gtk-module",
    "libappindicator-gtk3",
    "librsvg",
    "xdotool",
    "dart-sass",
    "typos",
    "maven",
    "typst",
    "tinymist",
    "gradle",
    "nodejs",
]
aur = ["codelldb-bin", "tailwindcss-cli", "jdtls", "ghcup-hs-bin"]
