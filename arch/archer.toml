name = "arch"

bashrc = [
    "export CONFIG_REPO=git@github.com:KaiPenazzi/configs.git",
    "alias vi='nvim .'",
    "export PATH=\"$HOME/.cargo/bin:$PATH\"",
]

[packages]
pacman = [
    "discord",
    "firefox",
    "htop",
    "keepassxc",
    "nextcloud-client",
    "unzip",
    "zip",
    "fastfetch",
    "chafa",
    "qmk",
    "borgbackup",
    "reflector",
    "arp-scan",
    "modrinth-app",
    "radeontop",
    "earlyoom",
    "mesa-utils",
    "netcat",
    "wireplumber",
    "pipewire-alsa",
    "pipewire-pulse",
    "openssh",
]

aur = ["aura", "spotify", "insomnia", "zen-browser-bin"]
